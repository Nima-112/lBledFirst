services:
  mysql:
    image: mysql:8.0
    container_name: lbledfirst-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lbled_first
      MYSQL_USER: lbled_first
      MYSQL_PASSWORD: lbled_first
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      default:
        aliases:
          - db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: lbledfirst-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/lbled_first?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: lbled_first
      SPRING_DATASOURCE_PASSWORD: lbled_first
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: lbledfirst-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080/api
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"

  adminer:
    image: adminer
    container_name: lbledfirst-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8090:8080"

volumes:
  mysql_data:
