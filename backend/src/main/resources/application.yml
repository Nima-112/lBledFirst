spring:
  datasource:
    url: jdbc:mysql://localhost:3307/lbled_first?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 512MB
  # Identifiants à créer sur https://console.cloud.google.com/apis/credentials
  # (Écran de consentement OAuth + Identifiant "Application Web").
  # URI de redirection autorisée à déclarer côté Google : http://localhost:8080/login/oauth2/code/google en local.
  # Ne jamais committer les vraies valeurs : toujours passer par les variables d'environnement.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:changeme}
            client-secret: ${GOOGLE_CLIENT_SECRET:changeme}
            scope: openid, profile, email

server:
  port: 8080

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:8081
    - https://tondomaine.com

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ChangeThisToALongRandomSecretKeyAtLeast32CharactersLongForHS256

cookie:
  secure: false # mettre true en production (HTTPS obligatoire)

app:
  admin:
    email: ${ADMIN_EMAIL:admin@lbledfirst.ma}
    password: ${ADMIN_PASSWORD:test123}
  oauth2:
    # Page du frontend vers laquelle on redirige une fois le cookie de session posé
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT:http://localhost:3000/me}
    failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT:http://localhost:3000/auth?error=google}
  upload:
    dir: ${APP_UPLOAD_DIR:/app/uploads/videos}

openai:
  api-key: ${OPENAI_API_KEY:changeme}
  model-transcription: whisper-1
  model-translation: gpt-4o-mini
