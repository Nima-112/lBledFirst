spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/lbled_first?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 512MB
  # Identifiants à créer sur https://console.cloud.google.com/apis/credentials
  # (Écran de consentement OAuth + Identifiant "Application Web").
  # URI de redirection autorisée à déclarer côté Google : http://localhost:8080/login/oauth2/code/google en local.
  # Ne jamais committer les vraies valeurs : toujours passer par les variables d'environnement.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid, profile, email
  # Compte SMTP utilisé pour l'email de vérification et le mot de passe oublié.
  # Avec Gmail : activer la validation en 2 étapes puis générer un "mot de passe
  # d'application" (https://myaccount.google.com/apppasswords) — ne jamais utiliser
  # le mot de passe du compte directement.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
  api-docs:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET}

cookie:
  secure: ${COOKIE_SECURE:false}

app:
  admin:
    email: ${ADMIN_EMAIL:admin@lbledfirst.ma}
    password: ${ADMIN_PASSWORD:}
  oauth2:
    # Page du frontend vers laquelle on redirige une fois le cookie de session posé
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT:http://localhost:3000/me}
    failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT:http://localhost:3000/auth?error=google}
  upload:
    dir: ${APP_UPLOAD_DIR:/app/uploads/videos}
  mail:
    from: ${MAIL_FROM:no-reply@lbledfirst.ma}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  backend:
    base-url: ${BACKEND_BASE_URL:http://localhost:8080}

openai:
  api-key: ${OPENAI_API_KEY:}
  model-transcription: whisper-1
  model-translation: gpt-4o-mini
  # whisper-language: ar
