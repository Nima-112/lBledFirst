spring:
  datasource:
    url: jdbc:mysql://localhost:3307/lbled_first?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

server:
  port: 8080

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:8081
    - https://tondomaine.com

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ChangeThisToALongRandomSecretKeyAtLeast32CharactersLongForHS256

cookie:
  secure: false # mettre true en production (HTTPS obligatoire)

app:
  admin:
    email: ${ADMIN_EMAIL:admin@lbledfirst.ma}
    password: ${ADMIN_PASSWORD:test123}